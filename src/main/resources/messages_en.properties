# Validation Errors
error.validation = An error occurred during data validation
error.invalid_field = The provided data is invalid
error.missing_field = Required information was not provided
error.out_of_range = The provided value is outside the allowed range
error.invalid_format = Invalid data format

# Authentication Errors
error.unauthorized = Please log in to continue
error.invalid_credentials = Invalid login credentials
error.token_expired = The session has expired. Please log in again
error.account_locked = Access to the account is temporarily restricted
error.account_disabled = The account is currently inactive

# Authorization Errors
error.forbidden = You do not have permission to perform this action
error.access_denied = Access denied

# Request Format Errors
error.invalid_request = Invalid request
error.invalid_json_format = Invalid request format
error.unsupported_media_type = Unsupported media type
error.method_not_allowed = This HTTP method is not supported

# Server Errors
error.internal_server_error = A technical error occurred. Please try again later
error.service_unavailable = The service is currently unavailable
error.unexpected = An unexpected error occurred

# Resource Errors
error.resource_not_found = The requested information was not found
error.resource_already_exists = This information already exists
error.resource_conflict = A data conflict was detected

# Rate Limiting Errors
error.too_many_requests = Too many requests were sent. Please wait a moment
error.rate_limit_exceeded = Request limit exceeded

# SMS Service Errors
error.sms_empty_response = An error occurred while communicating with the SMS service
error.sms_send_failed = Unable to send SMS
error.sms_balance_check_failed = An error occurred while communicating with the SMS service
error.sms_report_failed = Unable to retrieve SMS report
error.sms_unknown_status = Unexpected response received from the SMS service

# Notification Errors
error.notification.no_current_device = No current device found for user

